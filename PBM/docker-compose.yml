version: '3.8'

services:
  nginx:
    build:
      context: ./nginx
    container_name: ${CONTRAINER_NAME}_nginx
    restart: always
    volumes:
      - ./app/:/var/www/
      - ./logs/nginx:/var/log/nginx/
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - ${NGINX_PORT}:80
    networks:
      - network_app_pbm

  php-fpm:
    build:
      context: ./php-fpm
    container_name: ${CONTRAINER_NAME}_php-fpm
    restart: always
    volumes:
      - ./app/:/var/www/
      - ./php-fpm/php.ini:/usr/local/etc/php/conf.d/php.ini
      - ./logs/php.log:/var/log/fpm-php.www.log
    networks:
      - network_app_pbm
      - pharmacy_shared_network

  database_app_pbm:
    image: mariadb:latest
    container_name: ${CONTRAINER_NAME}_database
    restart: always
    expose:
      - ${MYSQL_PORT}    
    ports:
      - ${MYSQL_PORT}:3306 
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./database/data.sql:/docker-entrypoint-initdb.d/data.sql
      - ./mariadb:/var/lib/mysql
      - ./mariadb/my.cnf:/etc/mysql/my.cnf
    networks:
      - network_app_pbm

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ${CONTRAINER_NAME}_phpmyadmin
    restart: always
    environment:
      - PMA_ARBITRARY=1
      - TZ=Asia/Bangkok
    ports:
      - ${PHPMYADMIN_PORT}:80
    networks:
      - network_app_pbm

networks:
  network_app_pbm:
    name: network_app_pbm
    driver: bridge

  pharmacy_shared_network:
    external: true
