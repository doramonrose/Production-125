upstream php-upstream {
    server php-fpm:9000;
}

server {

    listen 80 default_server;
    listen [::]:80 default_server ipv6only=on;

    server_name pbm.pharmacy.cmu.ac.th localhost;
    root /var/www;
    index index.php index.html index.htm;

    # /budget -> /budget/
    location = /budget { return 301 /budget/$is_args$args; }

    # Laravel front controller for /budget/
    location = /budget/ {
        include fastcgi_params;
        fastcgi_pass php-upstream;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME /var/www/application/budget/public/index.php;
        fastcgi_param DOCUMENT_ROOT  /var/www/application/budget/public;

        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        fastcgi_read_timeout 600;
    }

    # Static assets + front controller fallback for /budget/*
    location ^~ /budget/ {
        alias /var/www/application/budget/public/;
        try_files $uri @budget;
    }

    location @budget {
        include fastcgi_params;
        fastcgi_pass php-upstream;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME /var/www/application/budget/public/index.php;
        fastcgi_param DOCUMENT_ROOT  /var/www/application/budget/public;

        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        fastcgi_read_timeout 600;
    }

    # Prevent direct PHP file access under /budget
    location ~ ^/budget/.*\.php$ { return 404; }

    # /withdraw -> /withdraw/
    location = /withdraw { return 301 /withdraw/$is_args$args; }

    # Laravel front controller for /withdraw/
    location = /withdraw/ {
        include fastcgi_params;
        fastcgi_pass php-upstream;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME /var/www/application/withdraw/public/index.php;
        fastcgi_param DOCUMENT_ROOT  /var/www/application/withdraw/public;

        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        fastcgi_read_timeout 600;
    }

    # Static assets + front controller fallback for /withdraw/*
    location ^~ /withdraw/ {
        alias /var/www/application/withdraw/public/;
        try_files $uri @withdraw;
    }

    location @withdraw {
        include fastcgi_params;
        fastcgi_pass php-upstream;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME /var/www/application/withdraw/public/index.php;
        fastcgi_param DOCUMENT_ROOT  /var/www/application/withdraw/public;

        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        fastcgi_read_timeout 600;
    }

    # Prevent direct PHP file access under /withdraw
    location ~ ^/withdraw/.*\.php$ { return 404; }

    # ระบบบริหารโครงการ (หน้าแรกคือ index.php)
    location = /application/project {
        return 301 /application/project/;
    }

    location ^~ /application/ {
        root /var/www;
        index index.php;
        try_files $uri $uri/ =404;

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass php-upstream;
            fastcgi_index index.php;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 600;
            include fastcgi_params;
        }
    }

    # User Manager เป็น root app ของโดเมน (ไม่ต้องมี /usermanager)
    location / {
        alias /var/www/usermanager/public/;
        try_files $uri @usermanager;
    }

    location @usermanager {
        include fastcgi_params;
        fastcgi_pass php-upstream;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME /var/www/usermanager/public/index.php;
        fastcgi_param DOCUMENT_ROOT  /var/www/usermanager/public;
        fastcgi_param SCRIPT_NAME /index.php;

        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        fastcgi_read_timeout 600;
    }

    location ~ \.php$ {
        # try_files $uri /index.php =404;
        try_files $uri =404;
        fastcgi_pass php-upstream;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        #fixes timeouts
        fastcgi_read_timeout 600;
        include fastcgi_params;
    }

    location /uploads {
        client_max_body_size 200M;
    }

    location ~ /\.ht {
        deny all;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt/;
        log_not_found off;
    }

    error_page 404 https://pbm.pharmacy.cmu.ac.th/template/pages/errors/404.html;
    location = https://pbm.pharmacy.cmu.ac.th/template/pages/errors/404.html {
        root /var/www/;
        internal;
    }
}
